<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample App - Task Tracker</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f4f6f8;
      }
      .card {
        background: #fff;
        border: 1px solid #dce1e6;
        border-radius: 12px;
        width: min(560px, 92vw);
        padding: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.4rem;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      input,
      button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
      }
      input {
        border: 1px solid #b8c2cc;
      }
      button {
        border: none;
        background: #1769aa;
        color: #fff;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 14px 0 0;
      }
      li {
        border: 1px solid #dce1e6;
        border-radius: 8px;
        padding: 10px;
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        background: #fff;
      }
      li.completed span {
        text-decoration: line-through;
        opacity: 0.65;
      }
      .small {
        background: #455a64;
      }
      .danger {
        background: #d32f2f;
      }
      .muted {
        margin-top: 12px;
        color: #546e7a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Task Tracker</h1>
      <div class="controls">
        <input id="taskInput" type="text" placeholder="Add a task..." />
        <button id="addTaskBtn" type="button">Add</button>
      </div>
      <ul id="taskList" aria-live="polite"></ul>
      <p class="muted">A tiny sample app generated by the agent.</p>
    </main>

    <script>
      const taskInput = document.getElementById("taskInput");
      const addTaskBtn = document.getElementById("addTaskBtn");
      const taskList = document.getElementById("taskList");

      const createButton = (label, className, onClick) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.className = className;
        button.addEventListener("click", onClick);
        return button;
      };

      const addTask = () => {
        const value = taskInput.value.trim();
        if (!value) return;

        const item = document.createElement("li");
        const text = document.createElement("span");
        text.textContent = value;

        const toggle = createButton("Done", "small", () => {
          item.classList.toggle("completed");
        });
        const remove = createButton("Delete", "danger", () => {
          item.remove();
        });

        item.append(text, toggle, remove);
        taskList.appendChild(item);
        taskInput.value = "";
        taskInput.focus();
      };

      addTaskBtn.addEventListener("click", addTask);
      taskInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") addTask();
      });
    </script>
  </body>
</html>
